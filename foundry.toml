# IMD6900 on Pons: the contract that launches Identity.MD 6900 as a Pons coin on Robinhood Chain, deployed by the IMD
# swarm. Builds offline: every library is vendored under lib/ (only what is imported). bytecode_hash = "none", as IMD's
# launches require.
[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.30"
bytecode_hash = "none"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
# the vanity miner (test/MineVanity.t.sol) asks Pons for ~65k addresses on average for 0x6900: far past forge's default
# gas limit for a test (2^30)
gas_limit = "18446744073709551615"
remappings = [
    "solady/=lib/solady/src/",
    "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
robinhood = "${ROBINHOOD_RPC_URL}"
